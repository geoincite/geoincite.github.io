<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Contact Card | GeoIncite</title>
  <!-- Self-hosted CryptoJS -->
  <script src="/cards/crypto-js.min.js"></script>
  <style>
    :root { --primary: #0f172a; --accent: #2563eb; --bg: #f8fafc; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 16px; }
    .card { background: white; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); padding: 32px; max-width: 380px; width: 100%; text-align: center; border: 1px solid #e2e8f0; }
    
    /* Updated Avatar Styling for Logo Image */
    .avatar { 
      width: 80px; 
      height: 80px; 
      background: #f1f5f9; 
      border-radius: 50%; 
      margin: 0 auto 16px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      overflow: hidden; 
      border: 2px solid #e2e8f0;
    }
    .avatar img { 
      width: 100%; 
      height: 100%; 
      object-fit: contain; 
      padding: 12px;
    }

    h1 { font-size: 22px; color: var(--primary); margin: 0 0 4px; }
    p.title { font-size: 14px; color: #64748b; margin: 0 0 16px; font-weight: 500; }
    .detail { font-size: 14px; color: #334155; margin: 8px 0; text-align: left; background: #f1f5f9; padding: 10px 14px; border-radius: 8px; word-break: break-all; }
    button { background: var(--accent); color: white; border: none; padding: 14px; width: 100%; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 20px; transition: background 0.2s; }
    button:hover { background: #1d4ed8; }
    .status { font-size: 14px; color: #64748b; }
    .error { color: #dc2626; text-align: left; white-space: pre-wrap; word-break: break-word; }
  </style>
</head>
<body>

<div class="card">
  <div id="loading" class="status">Decrypting contact details...</div>

  <div id="content" style="display: none;">
    <!-- Avatar replaced with Logo Image -->
    <div class="avatar">
      <img src="/cards/images/logo.png" alt="GeoIncite Logo" onerror="this.style.display='none';">
    </div>

    <h1 id="disp-name">Loading...</h1>
    <p class="title" id="disp-title">Title</p>

    <div class="detail"><strong>🏢 Company:</strong> GeoIncite</div>
    <div class="detail" id="disp-email"><strong>✉️ Email:</strong> -</div>
    <div class="detail" id="disp-phone"><strong>📱 Phone:</strong> -</div>
    <div class="detail" id="disp-address" style="display: none;"><strong>📍 Address:</strong> -</div>

    <button onclick="saveContact()">Save to Contacts (.vcf)</button>
  </div>
</div>

<script>
  let rawVCard = "";

  function showError(msg) {
    const loadingEl = document.getElementById('loading');
    loadingEl.className = "status error";
    loadingEl.innerText = msg;
  }

  async function init() {
    const loadingEl = document.getElementById('loading');

    // 0. Confirm CryptoJS loaded
    if (typeof CryptoJS === "undefined") {
      showError("Access Denied: Failed to load decryption library (CryptoJS). Check /cards/crypto-js.min.js is reachable.");
      return;
    }

    const params = new URLSearchParams(window.location.search);
    const empId = params.get('id');

    let rawHash = window.location.hash.substring(1);
    while (rawHash.startsWith('#')) rawHash = rawHash.substring(1);
    const secretKey = decodeURIComponent(rawHash).trim();

    if (!empId || !secretKey) {
      showError("Access Error: Missing ID or decryption key in URL.");
      console.error("Missing parameters:", { empId, secretKeyPresent: !!secretKey });
      return;
    }

    try {
      // Updated target URL path to match Python generator path (/assets/vcf/)
      const targetUrl = `/assets/vcf/${empId}.vcf.enc?_cb=${Date.now()}`;
      console.log(`Fetching encrypted file from: ${targetUrl}`);

      const response = await fetch(targetUrl, { cache: "no-store" });
      if (!response.ok) throw new Error(`HTTP ${response.status}: File not found at ${targetUrl}`);

      const rawText = await response.text();
      const encryptedText = rawText.trim();

      const decryptedBytes = CryptoJS.AES.decrypt(encryptedText, secretKey);
      rawVCard = decryptedBytes.toString(CryptoJS.enc.Utf8);

      if (!rawVCard || !rawVCard.includes("BEGIN:VCARD")) {
        throw new Error(
          "Decryption output failed vCard format check. (Invalid Key or Payload)\n\n" +
          `Debug info:\n` +
          `  id param: ${JSON.stringify(empId)}\n` +
          `  key used: ${JSON.stringify(secretKey)} (${secretKey.length} chars)\n` +
          `  file fetched: ${targetUrl} (${encryptedText.length} chars)`
        );
      }

      const name = (rawVCard.match(/FN:(.*)/) || [])[1] || "Employee";
      const title = (rawVCard.match(/TITLE:(.*)/) || [])[1] || "Staff";
      const email = (rawVCard.match(/EMAIL:(.*)/) || [])[1] || "";
      const phone = (rawVCard.match(/TEL;TYPE=CELL:(.*)/) || [])[1] || "";
      const adrMatch = rawVCard.match(/ADR(?:;[^:]*)?:(.*)/);

      document.getElementById('disp-name').innerText = name.trim();
      document.getElementById('disp-title').innerText = title.trim();
      document.getElementById('disp-email').innerHTML = `<strong>✉️ Email:</strong> ${email.trim()}`;
      document.getElementById('disp-phone').innerHTML = `<strong>📱 Phone:</strong> ${phone.trim()}`;

      if (adrMatch) {
        const parts = adrMatch[1].split(';').map(p => p.trim());
        const readable = [parts[2], parts[3], parts[4], parts[5], parts[6]]
          .filter(Boolean).join(', ');
        if (readable) {
          const addrEl = document.getElementById('disp-address');
          addrEl.innerHTML = `<strong>📍 Address:</strong> ${readable}`;
          addrEl.style.display = "block";
        }
      }

      loadingEl.style.display = "none";
      document.getElementById('content').style.display = "block";

    } catch (err) {
      console.error("Decryption Error:", err);
      showError("Access Denied: " + err.message);
    }
  }

  function saveContact() {
    const blob = new Blob([rawVCard], { type: 'text/vcard;charset=utf-8;' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.setAttribute('download', 'contact.vcf');
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }

  window.addEventListener('DOMContentLoaded', init);
</script>

</body>
</html>
